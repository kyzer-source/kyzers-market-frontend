<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Kyzers Market</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#050507;
    --panel:rgba(255,255,255,0.04);
    --border:rgba(255,255,255,0.08);
    --text:#ffffff;
    --muted:#a1a1aa;
    --purple:#7c3aed;
    --green:#22c55e;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:
        radial-gradient(circle at 15% 20%, rgba(124,58,237,0.25), transparent 40%),
        radial-gradient(circle at 80% 60%, rgba(34,197,94,0.10), transparent 40%),
        var(--bg);
    color:var(--text);
    min-height:100vh;
}

/* LOGIN */
.login-screen{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.85);
    backdrop-filter:blur(10px);
    z-index:999;
}

.login-box{
    width:320px;
    padding:24px;
    border-radius:16px;
    background:var(--panel);
    border:1px solid var(--border);
}

.login-box input{
    width:100%;
    padding:10px;
    margin-top:10px;
    border-radius:10px;
    border:1px solid var(--border);
    background:transparent;
    color:white;
}

.login-box button{
    width:100%;
    margin-top:12px;
    padding:10px;
    border-radius:10px;
    border:none;
    background:linear-gradient(135deg,#7c3aed,#6d28d9);
    color:white;
    cursor:pointer;
}

/* TOP BAR */
.topbar{
    padding:20px 30px;
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
    background:rgba(0,0,0,0.3);
}

/* CONTAINER */
.container{
    padding:30px;
    max-width:1200px;
    margin:auto;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    margin-bottom:25px;
}

.card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px;
}

.card p{
    font-size:22px;
    font-weight:700;
}

.table-container{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
}

.table{
    width:100%;
    border-collapse:collapse;
}

.table th, .table td{
    padding:14px;
    font-size:13px;
}

.table th{
    color:var(--muted);
    background:rgba(255,255,255,0.03);
}

.status{
    padding:4px 10px;
    border-radius:999px;
    background:rgba(34,197,94,0.15);
    color:var(--green);
    font-size:12px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
    <div class="login-box">
        <h3>Admin Login</h3>
        <input type="password" id="pass" placeholder="Enter password">
        <button onclick="login()">Login</button>
    </div>
</div>

<div id="dashboard" style="display:none;">

    <div class="topbar">
        <div><b>Kyzers Admin</b></div>
        <div>Live Dashboard</div>
    </div>

    <div class="container">

        <div class="stats">
            <div class="card">
                <h4>Total Orders</h4>
                <p id="ordersCount">0</p>
            </div>

            <div class="card">
                <h4>Revenue</h4>
                <p id="revenue">£0</p>
            </div>
        </div>

        <div class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Product</th>
                        <th>Email</th>
                        <th>Amount</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="ordersTable"></tbody>
            </table>
        </div>

    </div>

</div>

<script>
const ADMIN_KEY = "Kuros1204"; // CHANGE THIS

function login(){
    const val = document.getElementById("pass").value;

    if(val === ADMIN_KEY){
        localStorage.setItem("admin", "true");
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        load();
    } else {
        alert("Wrong password");
    }
}

if(localStorage.getItem("admin") === "true"){
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    load();
}

async function load(){
    const orders = await fetch("/admin/orders").then(r => r.json());
    const stats = await fetch("/admin/stats").then(r => r.json());

    document.getElementById("ordersCount").innerText = stats.orders || 0;
    document.getElementById("revenue").innerText = "£" + ((stats.revenue || 0)/100).toFixed(2);

    document.getElementById("ordersTable").innerHTML =
        orders.map(o => `
            <tr>
                <td>${o.orderId}</td>
                <td>${o.product}</td>
                <td>${o.email}</td>
                <td>£${(o.amount/100).toFixed(2)}</td>
                <td><span class="status">${o.status}</span></td>
            </tr>
        `).join("");
}
</script>

</body>
</html>
